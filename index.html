<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Desktop Controller</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

</head>

<body>

<div class="container">

    <h1>🖥️ Desktop Controller</h1>

    <p id="status">Connecting...</p>

    <!-- UPS CARD -->
    <div class="card">

        <div class="cardHeader">

            <h2>UPS</h2>

            <div id="upsLed" class="led off"></div>

        </div>

        <button id="upsBtn">Trigger UPS</button>

        <div class="angleBox">

            <div>

                <label>Start Position</label>

                <input
                    type="number"
                    id="upsStart"
                    min="0"
                    max="180"
                    value="180">

            </div>

            <div>

                <label>Rotate Position</label>

                <input
                    type="number"
                    id="upsRotate"
                    min="0"
                    max="180"
                    value="0">

            </div>

        </div>

        <p id="upsError" class="error"></p>

    </div>



    <!-- CPU CARD -->

    <div class="card">

        <div class="cardHeader">

            <h2>Desktop CPU</h2>

            <div id="cpuLed" class="led off"></div>

        </div>

        <button id="cpuBtn">Trigger CPU</button>

        <div class="angleBox">

            <div>

                <label>Start Position</label>

                <input
                    type="number"
                    id="cpuStart"
                    min="0"
                    max="180"
                    value="180">

            </div>

            <div>

                <label>Rotate Position</label>

                <input
                    type="number"
                    id="cpuRotate"
                    min="0"
                    max="180"
                    value="0">

            </div>

        </div>

        <p id="cpuError" class="error"></p>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
